<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Tracker</title>
    <style>
      :root {
        --surface: #ffffff;
        --canvas: #f6f7f9;
        --ink: #0f172a;
        --ink-2: #475569;
        --ink-3: #94a3b8;
        --line: #e8ecf1;
        --accent: #2563eb;
        --good: #15803d;
        --bad: #dc2626;
        --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
        --shadow-md: 0 2px 4px rgba(15,23,42,.04), 0 8px 20px -6px rgba(15,23,42,.10);
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,
                     "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv02","cv03","cv04","ss01";
      }

      button { font-family: inherit; transition: background-color .15s ease, border-color .15s ease,
               color .15s ease, box-shadow .15s ease, transform .12s ease; }
      button:not(:disabled):active { transform: translateY(.5px); }
      input, select, textarea { font-family: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
      input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37,99,235,.16);
      }

      /* Numeric columns align; standalone display figures stay proportional. */
      .num { font-variant-numeric: tabular-nums; }

      .card-hover { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
      .card-hover:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

      tbody tr { transition: background-color .12s ease; }
      tbody tr:hover { background: #f7f9fc; }
      table { border-collapse: collapse; }

      ::selection { background: rgba(37,99,235,.16); }

      ::-webkit-scrollbar { width: 11px; height: 11px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d4dae2; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #b9c2cd; background-clip: content-box; }

      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
