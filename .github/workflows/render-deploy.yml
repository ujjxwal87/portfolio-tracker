# Deploys to Render on every push to main, via Render deploy hooks (secret URLs from
# Render → service → Settings → Deploy Hook). Doesn't depend on Render's own auto-deploy.
name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend deploy
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK_WEB secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Frontend deploy triggered"
      - name: Trigger backend deploy
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK_API }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_API not set, skipping backend"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Backend deploy triggered"
